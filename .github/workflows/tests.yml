name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Install ruff
        run: python -m pip install "ruff==0.17.3"
      - name: Check code
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Check interface formatting
        run: npx --yes prettier@3.3.3 --check "src/acervo/web/static/*.js" src/acervo/web/static/style.css

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile modules
        run: python -m compileall -q src tests
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Check interface syntax
        run: for f in src/acervo/web/static/*.js; do node --check "$f"; done

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/acervo-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: python -m pip install -r ../../requirements.txt
      - name: Check formatting
        run: cargo fmt --check
      - name: Check code
        run: cargo clippy --release --locked -- -D warnings
      - name: Build
        run: cargo build --release --locked
      - name: Compare with the Python version
        working-directory: .
        run: ACERVO_SCAN_BIN=crates/acervo-core/target/release/scan PYTHONPATH=src python -m unittest tests.test_rust_scan_parity -v
